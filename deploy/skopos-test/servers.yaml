db_path: "./skopos.sqlite3"

# Optional MaxMind GeoLite2-Country — auto-installed on deploy when MAXMIND_LICENSE_KEY is set.
# Default country lookup: geojs.io + ipwho.is (free HTTP, no signup).
# geoip_mmdb_path: "/app/geoip/GeoLite2-Country.mmdb"

poll_interval_seconds: 15
batch_lines_per_server: 4000
security_auto_scan: true
security_scan_interval_minutes: 60

# Every host here reports in over HTTPS with its own credential. SKOPOS holds no
# SSH key for any of them and never connects out, so compromising this dashboard
# does not hand anyone the fleet.
#
# Onboarding one host:
#   python skoposctl.py node-ticket    --server <name>
#   python skoposctl.py node-installer --server <name> \
#       --base-url https://skopos.modelmarket.dev --out install.sh
#   scp install.sh <host>: && ssh <host> "printf %s '<ticket>' | sudo bash install.sh"
#
# `address` only labels the traffic; nothing dials it.
#
# This file is the whole list. A host enrolled with a ticket but missing here
# authenticates fine and then has every report refused, silently; deploy.sh
# runs `skoposctl node-check` against it and refuses to go live in that case.

servers:
  - name: factory
    source: ssh_nginx_access_log
    transport: agent-push
    address: modeldev.modelmarket.dev
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: false

  - name: oracle
    source: ssh_nginx_access_log
    transport: agent-push
    address: oracles.modelmarket.dev
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: false

  - name: metis
    source: ssh_http_access_log
    transport: agent-push
    address: skopos.modelmarket.dev
    nginx:
      access_log_paths: []
      auto_discover_logs: false
      auto_discover_docker_logs: true
      # The agent only reads containers named here, and the list is written into
      # a root-owned file on the host at install time.
      docker_log_containers:
        - metis-nginx
    # No apache-test fixture in production — only real nginx/docker log sources.

  - name: competing-lab
    source: ssh_nginx_access_log
    transport: agent-push
    address: hub.modelmarket.dev
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: false
      docker_log_containers:
        - modelmarket-hub
        - signal-hunt-hub-1
        - signal-hunt-game-1

  - name: attested
    source: ssh_nginx_access_log
    transport: agent-push
    address: attestedmemory.net
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: true
      docker_log_containers:
        - aicom-edge-1

  # pingblip.com + forge.pingblip.com + world.pingblip.com on one VPS.
  # Combined log only — blip.access.log is a custom GeoIP format for Yard, not SKOPOS.
  - name: pingblip
    source: ssh_nginx_access_log
    transport: agent-push
    address: pingblip.com
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: false
      auto_discover_docker_logs: false

  - name: independentai-hub
    source: ssh_nginx_access_log
    transport: agent-push
    address: independentai.network
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: false

  # The factory host since the 2026-10-01 move (magic-ai-factory.com, the apex
  # hub). `factory` above is the agent still enrolled on the previous host.
  - name: factory-vps
    source: ssh_nginx_access_log
    transport: agent-push
    address: magic-ai-factory.com
    nginx:
      access_log_path: /var/log/nginx/access.log
      auto_discover_logs: true
      auto_discover_docker_logs: false
