name: Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated models (e.g. deepseek-chat,gpt-4o-mini)"
        required: false
        default: "deepseek-chat"
      dataset:
        description: "Dataset name or all"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run mock harness tests (CI-safe)
        run: pytest tests/benchmarks -m benchmark -q

      - name: Run live benchmarks (skipped without API keys)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Through env, not ${{ }} in the script: this step holds the API keys.
          BENCH_MODELS: ${{ github.event.inputs.models }}
          BENCH_DATASET: ${{ github.event.inputs.dataset }}
        run: |
          metis-benchmark run \
            --models "$BENCH_MODELS" \
            --dataset "$BENCH_DATASET" \
            --compare direct,metis \
            --output reports/bench-${{ github.run_id }}.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: benchmark-report
          path: reports/
          if-no-files-found: ignore
